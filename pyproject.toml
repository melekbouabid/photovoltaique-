[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarvision"
version = "2.0.0"
description = "Prévision de la production photovoltaïque journalière sur 30 villes (France, Tunisie, Espagne)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "pydantic>=2.6",
    "typer>=0.12",
    "requests>=2.31",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "pmdarima>=2.0.4",
    "arch>=7",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "prophet>=1.1.6",
    "torch>=2.4",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Outils MLOps : installés à part, car plus lourds que le cœur de l'étude.
mlops = ["mlflow>=2.16", "pandera>=0.20", "evidently>=0.4", "dvc>=3.50"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8", "nbconvert>=7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: tests longs (entraînement, réseau), exclus par défaut de la CI rapide",
    "data: tests qui ont besoin des données traitées",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["python", "rag", "llm", "rapport", "app", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
