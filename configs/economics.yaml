  # sont rares en résidentiel ; source à confirmer : rapports IRENA et Fraunhofer ISE « Photovoltaics Report ».
  crystSi: {capex_multiplier: [1.00, 1.00, 1.00], degradation_per_year: [0.003, 0.005, 0.008]}
  CIS: {capex_multiplier: [0.95, 1.10, 1.30], degradation_per_year: [0.005, 0.010, 0.015]}
  CdTe: {capex_multiplier: [0.90, 1.05, 1.25], degradation_per_year: [0.003, 0.005, 0.010]}

