# Hypothèses économiques. AUCUNE de ces valeurs n'est une donnée du projet : ce sont des ordres de grandeur
# à confirmer auprès de la source indiquée avant toute utilisation. Statut de chaque paramètre : TODO_VERIFY.
# Chaque paramètre est donné par trois valeurs [basse, centrale, haute] : la simulation de Monte-Carlo tire
# dans une loi triangulaire, et tous les résultats sont publiés avec un intervalle (P10, P50, P90).
# Ce calcul n'est pas un conseil financier.

status: TODO_VERIFY
currency: EUR

system:
  peak_power_kwp: 3.0                        # installation résidentielle type
  lifetime_years: 25
  self_consumption_share: [0.25, 0.40, 0.70] # part de la production consommée sur place ; TODO_VERIFY (dépend du foyer)

monte_carlo:
  draws: 5000
  percentiles: [10, 50, 90]

common:
  discount_rate: [0.02, 0.04, 0.07]          # TODO_VERIFY : taux d'actualisation réel
  energy_price_inflation: [0.00, 0.02, 0.05] # TODO_VERIFY : hausse annuelle du prix de l'électricité
  om_cost_share_of_capex: [0.010, 0.015, 0.020]   # TODO_VERIFY : entretien annuel, en part de l'investissement

technologies:
