    export_price_eur_kwh: [0.03, 0.06, 0.10]        # TODO_VERIFY : valeur du kWh injecté en comptage net
    capex_eur_per_kwp: [800, 1100, 1500]            # TODO_VERIFY
    grid_emission_g_co2_kwh: [420, 480, 560]        # TODO_VERIFY
  Espagne:
