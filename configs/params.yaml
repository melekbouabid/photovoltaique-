# Paramètres de l'étude. Tout réglage vit ici : le code ne contient aucune valeur en dur.
seed: 42

period:
  start_year: 2005          # début de la base de rayonnement PVGIS-SARAH3
  end_year: 2023            # dernière année complète de la base

split:
  train_fraction: 0.9       # découpage chronologique : coupure à int(n * 0.9), jamais aléatoire

horizons: [1, 2, 3, 4, 5, 6, 7]

pv:
  technologies: [crystSi, CIS, CdTe]
  reference_technology: crystSi     # technologie de l'étude historique (v1)
  peak_power_kwp: 1
  system_loss_pct: 14               # valeur par défaut de PVGIS
  aspect_deg: 0                     # plein sud (convention PVGIS)

fast_cities: [paris, tunis, madrid] # une ville par pays, pour les essais et la CI

ingest:
  pvgis_chunks: [[2005, 2009], [2010, 2014], [2015, 2019], [2020, 2023]]  # une réponse de 19 ans est trop lourde
  pvgis_workers: 3                  # appels PVGIS en parallèle (limite du service : 30 appels par seconde)
  open_meteo_pause_s: 180           # pause entre deux villes : une requête de 19 ans pèse lourd dans le quota gratuit
  nasa_pause_s: 2
  max_wait_on_429_s: 300            # au-delà, on arrête proprement et on note l'heure de reprise
  retries: 4
  timeout_s: 600

imputation:
  sun_height_gap_deg: 5             # écart entre hauteur astronomique à midi et hauteur maximale PVGIS
  ghi_ratio_threshold: 0.25         # PVGIS inférieur au quart des sources indépendantes
  ghi_nasa_min_kwh_m2: 1.5          # en dessous, la journée est réellement sombre : pas de conclusion
  require_era5_agreement: true      # comme en v1 : ERA5 doit confirmer NASA POWER quand il est disponible
  window_days: 31                   # médiane roulante centrée du rapport PVGIS / NASA
  min_periods: 10
  ref_min_kwh_m2: 0.2               # rapport non calculé quand NASA est quasi nul
  exo_interpolation_limit_days: 3

quality:
  iqr_factor: 3.0                   # valeur aberrante : hors de [Q1 - k IQR, Q3 + k IQR] par mois de l'année
  expected_imputed_days: [5, 20]    # hors de cette plage, la ville est signalée (attendu : 11 à 15)

features:
  fourier_harmonics: 2
  lags_days: [1, 7]
  rolling_window_days: 7
  climatology_window_days: 31       # lissage circulaire de la normale ; sans lui, le RMSE de la climatologie monte de 3 %
  # Scénario ex post : la météo du jour visé, SANS les grandeurs de rayonnement. Le rayonnement PVGIS est
  # l'entrée même de la simulation de la production (le garder reviendrait à donner la réponse), et les
  # autres rayonnements en sont trop proches. On garde nuages, pluie, humidité, température, vent, aérosols.
  ex_post_excluded: [ghi_pvgis_kwh_m2, irr_poa_kwh_m2, ghi_era5_kwh_m2, ghi_nasa_kwh_m2, indice_clarte,
                     ensoleillement_h, et0_mm]

evaluation:
  refit_every_days: 30              # fréquence de réajustement ; chaque date de test reste évaluée
  dm_losses: [squared, absolute]
  holm_alpha: 0.05
  bootstrap_block_days: 30
  bootstrap_replicates: 500

deep:
  window_days: 14
  hidden_size: 64
  dropout: 0.1
  max_epochs: 30
  patience: 4
  batch_size: 256
  learning_rate: 0.001
  walk_forward_folds: 3
  fast_max_epochs: 3
  interval_level: 0.95              # intervalle conforme du LSTM global (marge = quantile des erreurs de validation)

monitoring:
  psi_warning: 0.10                 # indice de stabilité de population : à surveiller
  psi_alert: 0.25                   # dérive marquée
  rolling_window_days: 30
  error_ratio_alert: 1.20           # alerte si l'erreur du modèle dépasse de 20 % celle de la climatologie

serving:
  request_log: reports/monitoring/requests.jsonl

report:
  title: "Prévoir la production photovoltaïque journalière : villes, technologies et bénéfices"
  subtitle: "Mini-projet Séries Temporelles pour Data Science & IA - TEK-UP - option B (environnement et énergie)"
  authors: "[Noms des membres du groupe : à renseigner dans configs/params.yaml]"
  date: "12 octobre 2026"
